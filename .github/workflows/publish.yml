name: Publish APT repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  # GitHub Pages only updates the site for deployments from the default
  # branch, so a release (tag ref) run only dispatches a build on the default
  # branch. The run URL is logged so a failed deploy stays traceable.
  trigger:
    name: Trigger Pages deploy on default branch
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch default-branch run
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run publish.yml --ref "$DEFAULT_BRANCH" --repo "$GITHUB_REPOSITORY"

          run_url=''
          for _ in $(seq 1 10); do
            sleep 3
            run_url=$(gh run list \
              --workflow publish.yml \
              --event workflow_dispatch \
              --limit 1 \
              --repo "$GITHUB_REPOSITORY" \
              --json url \
              --jq '.[0].url')
            [[ $run_url ]] && break
          done

          printf 'Dispatched Pages deploy: %s\n' "${run_url:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build repository
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils gnupg jq

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY" || {
            echo "APT_GPG_PRIVATE_KEY secret is missing" >&2
            exit 1
          }

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons >/dev/null
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: scripts/build-repo.sh

      - name: Test repository
        run: scripts/test-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Deploy Pages
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
